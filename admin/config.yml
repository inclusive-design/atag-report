# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

backend:
  name: github
  branch: main
  squash_merges: true
  repo: inclusive-design/atag-report
  base_url: https://auth.incd.ca
  commit_messages:
    create: 'chore(cms): create "{{path}}"'
    update: 'chore(cms): update "{{path}}"'
    delete: 'chore(cms): delete "{{path}}"'
    uploadMedia: 'chore(cms): upload "{{path}}"'
    deleteMedia: 'chore(cms): delete "{{path}}"'

media_folder: /media
public_folder: /media

singletons:
  - name: metadata
    label: Metadata
    file: _data/metadata.json
    editor:
      preview: false
    fields:
      - name: title
        label: Title
        widget: string
      - name: slug
        label: Slug
        widget: string
        default: "{{ fields.title | slugify }}"

  - name: document
    label: Content
    file: index.typ
    format: raw
    fields:
      - label: Document
        name: body
        widget: code
        output_code_only: true
        allow_language_selection: false
        default_language: typst

  - name: bibliography
    label: Bibliography
    file: bibliography.yml
    format: raw
    editor:
      preview: false
    fields:
      - label: Bibliography
        name: body
        widget: code
        output_code_only: true
        allow_language_selection: false
        default_language: yaml
