baldiris_accessibility_2019:
  abstract: The use of ICT in the classroom has allowed new teaching strategies, including the use of interactive software. However, during the design and implementation of this type of software, existing standards or recommendations for the creation of accessible Web content are not taken into account. This is why the accessibility in Web content, specifically in educational context, has been the subject of much discussion regarding the need to make Web educational content accessible to all students, regardless of their abilities or disabilities. The present study makes a literature review to identify those Authoring Tools that are being used by teachers in the areas of exact sciences, emphasizing mathematics, physics and geometry. Subsequently, the Web content generated by the identified Authoring Tools is evaluated in compliance with WCAG 2.1 recommendations, with the purpose of enunciating some conclusions and next issues to research.
