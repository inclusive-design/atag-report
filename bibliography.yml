yeratziotis_web-based_2025:
  abstract: Web users vary widely in characteristics such as age, education level, technological proficiency, and, critically, ability. Disabilities - whether sensory (e.g., vision or hearing), motor (e.g., limited hand mobility), or cognitive (e.g., learning difficulties) - affect a significant portion of the population and can hinder equitable access to online content. Designing with accessibility and inclusiveness in mind is essential to ensuring equal access for all users. One key requirement for web accessibility is the use of meaningful alternative text (alt-text) for images.This paper presents a tool for automatic recognition, authoring, and enhancement of image alt-text, developed in alignment with established accessibility guidelines. The tool design was informed by a review on web accessibility and alt-text practices, with particular attention to common challenges and the critical role of alt-text in inclusive web design. Existing tools were also examined to identify gaps and inform improvements. Building on this foundation, the Alt-Text Authoring Tool was developed and evaluated against similar tools, demonstrating enhanced functionality. The tool was evaluated by ICT professionals in Greece and Cyprus with respect to its usefulness, usability, educational value, and potential for adoption.
