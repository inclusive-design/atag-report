gurita_insights_2025:
  type: article
  title: Insights and {Implications} of {Evaluating} {Accessibility} {Compliance} in {AI}-{Generated} {Web} {Interfaces}
  author:
  - Guriță, Alexandra-Elena
  - Vatavu, Radu-Daniel
