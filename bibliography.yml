    type: periodical
    title: Journal of Business and Technical Communication
    publisher: SAGE Publications Inc
    issue: 1
    volume: 39
suh_human_nodate:
  type: article
  title: Human or {LLM}? {A} {Comparative} {Study} on {Accessible} {Code} {Generation} {Capability}
  author:
  - Suh, Hyunjae
  - Tafreshipour, Mahan
  - Malek, Sam
  - Ahmed, Iftekhar
  abstract: Web accessibility is essential for inclusive digital experiences, yet the accessibility of LLM-generated code remains underexplored. This paper presents an empirical study comparing the accessibility of web code generated by GPT-4o and Qwen2.5-Coder-32B-InstructAWQ against human-written code. Results show that LLMs often produce more accessible code, especially for basic features like color contrast and alternative text, but struggle with complex issues such as ARIA attributes. We also assess advanced prompting strategies (Zero-Shot, Few-Shot, Self-Criticism), finding they offer some gains but are limited. To address these gaps, we introduce FeedA11y, a feedback-driven ReAct-based approach that significantly outperforms other methods in improving accessibility. Our work highlights the promise of LLMs for accessible code generation and emphasizes the need for feedback-based techniques to address persistent challenges. We provide the source code and datasets that were used in our experiments in the companion website [5].
  parent:
    type: periodical
pillai_website_2022:
  type: article
  title: Website {Builders} {Still} {Contribute} {To} {Inaccessible} {Web} {Design}
  author:
