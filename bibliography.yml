baldiris_evaluation_2023:
  abstract: Authoring tools are software programs that allow users to create learning content, lessons, and courses, usually to be used in virtual learning environments. These tools are a reasonable choice for novice users, as they use pre-programmed elements and do not require specific programming skills. However, they do not always meet accessibility guidelines, nor do they ensure that the educational content generated through them is accessible. This study first evaluates the accessibility of four popular free open-source authoring tools based on the ATAG recommendations. Then it evaluates the accessibility of the educational content generated through them based on the WCAG recommendations. These evaluations allow us to identify the level of accessibility of the authoring tools and their potential to help people with disabilities to become not only consumers but also producers of accessible educational content. We conclude that, while much work remains to be done to ensure accessibility, authoring tools are a potential key to effective social inclusion. Based on the findings of this study, we establish a set of recommendations for stakeholders to help close some gaps regarding accessibility.
