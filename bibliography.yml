baldiris_accessibility_2019:
  type: article
  title: Accessibility {Evaluation} of {Web} {Content} that {Support} the {Mathematics}, {Geometry} and {Physics}'s {Teaching} {And} {Learning}
  author:
  - Baldiris, Silvia
  - Mancera, Laura
  - Vargas, David
  - Velez, Gloria
