mowar_accessibility_2024:
  abstract: Despite extensive accessibility research, inaccessible websites remain stubbornly prevalent, partly due to limited accessibility awareness among web developers. The advent of code generation models presents an opportunity to guide accessibility-unaware developers toward enhanced accessibility practices. Our work examines the current state of accessibility in AI-assisted web development. Empirical evidence reveals code generation models serve as a double-edged sword, prompting a discussion on future research directions.
