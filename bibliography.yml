    isbn: 978-1-4503-9258-7
  abstract: Website builders enable individuals without design or technical skills to create websites. However, it is unclear if modern websites created by website builders meet accessibility standards. We reviewed six popular website building platforms and found a lack of accessibility support. Wix provided the most comprehensive accessibility documentation and robust accessibility features. However, during an accessibility audit of 90 Wix webpages, we found many accessibility issues, raising concerns about how users are supported.
